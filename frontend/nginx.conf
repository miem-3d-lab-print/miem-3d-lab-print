limit_req_zone $binary_remote_addr zone=otp_request_per_ip:10m rate=2r/m;
limit_req_zone $server_name zone=otp_request_global:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otp_verify_per_ip:10m rate=6r/m;
limit_req_zone $server_name zone=otp_verify_global:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $server_name zone=api_global:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  limit_req_status 429;
  limit_conn_status 429;
  limit_conn connections_per_ip 30;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # One file up to 100 MB plus multipart overhead.
  client_max_body_size 105m;

  location = /api/auth/request-otp {
    limit_req zone=otp_request_per_ip burst=2 nodelay;
    limit_req zone=otp_request_global burst=10 nodelay;

    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/verify-otp {
    limit_req zone=otp_verify_per_ip burst=5 nodelay;
    limit_req zone=otp_verify_global burst=20 nodelay;

    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    limit_req zone=api_global burst=200 nodelay;

    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location = /swagger {
    proxy_pass http://backend:8080/swagger;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }
}
