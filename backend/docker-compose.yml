services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miem3dprint
      POSTGRES_USER: miem
      POSTGRES_PASSWORD: miem
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miem -d miem3dprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    restart: "no"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: miem3dprint
      POSTGRES_USER: miem
      POSTGRES_PASSWORD: miem
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://miem:miem@db:5432/miem3dprint?sslmode=disable
      JWT_SECRET: development-only-secret-change-me-123456
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: 3d-files
      MINIO_USE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@miem-3d-lab.local
      SITE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pg_data:
  minio_data:
