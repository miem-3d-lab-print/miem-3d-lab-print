host: localhost:3000
info:
  contact: {}
  description: REST API сервиса подачи заявок на 3D-печать МИЭМ НИУ ВШЭ.\nАутентификация
    — OTP через email + JWT (Bearer token).
  title: MIEM 3D Lab Print API
  version: 1.0.0
paths:
  /api/admin/admins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_dto.AdminUsersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список администраторов
      tags:
      - admin-users
  /api/admin/applications:
    get:
      parameters:
      - collectionFormat: multi
        description: Фильтр по статусам
        in: query
        items:
          enum:
          - new
          - in_review
          - printing
          - ready
          - issued
          - rejected
          - cancelled
          type: string
        name: status
        type: array
      - description: Поиск по имени / email
        in: query
        name: search
        type: string
      - description: UUID материала
        format: uuid
        in: query
        name: material_id
        type: string
      - description: Дата создания от (YYYY-MM-DD)
        in: query
        name: created_from
        type: string
      - description: Дата создания до (YYYY-MM-DD)
        in: query
        name: created_to
        type: string
      - description: Желаемая дата от (YYYY-MM-DD)
        in: query
        name: desired_from
        type: string
      - description: Желаемая дата до (YYYY-MM-DD)
        in: query
        name: desired_to
        type: string
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      - default: 20
        description: Записей на странице
        in: query
        maximum: 100
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_dto.AdminApplicationListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список всех заявок (admin)
      tags:
      - admin-applications
  /api/admin/applications/{id}:
    get:
      parameters:
      - description: ID заявки
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_dto.ApplicationDetailAdmin'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Детали заявки (admin)
      tags:
      - admin-applications
  /api/admin/applications/{id}/files/{file_id}:
    get:
      parameters:
      - description: ID заявки
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: ID файла
        format: uuid
        in: path
        name: file_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "410":
          description: Файл удалён
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Скачать файл заявки (admin)
      tags:
      - admin-applications
  /api/admin/applications/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID заявки
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Новый статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_dto.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_dto.ChangeStatusResponse'
        "400":
          description: Невалидный статус / отсутствует обязательное поле
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_miem-3d-lab-print_miem-3d-lab-print_backend_src_internal_apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
